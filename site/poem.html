  <!-- Winter Light, first stanza. -->
  <p data-poem>If you had to go
I would have to see
the cold air and the black night sky,
And what did you say
everyone was like?
The wind moved off.</p>
  <!-- The Moon at Noon. -->
  <p data-poem hidden>That night, the moon on a tree
Sits silently down in o'erlooking the lawn.
He shakes his head and cries into taut wings,
And I see it's dawn as he passes by.</p>
  <!-- A Small Machine Dreams. -->
  <p data-poem hidden>All night, all night and day,
I wonder that you are dead.
And over the long ago
The moon fell in full rain;
But there is nothing but snow:
We were going today.</p>
